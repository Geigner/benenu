<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>בינינו · benenu — תפריט</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #faf8f5;
      --surface: #ffffff;
      --surface-alt: #f3efe9;
      --ink: #221e1b;
      --muted: #6f675f;
      --accent: #395241;
      --accent-soft: #eef3ef;
      --warm: #a85b32;
      --border: #e6dfd5;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Heebo', sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
      padding-bottom: 56px;
      -webkit-font-smoothing: antialiased;
    }

    body.ordering-mode {
      padding-bottom: 96px;
    }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 26px 18px 20px;
      text-align: center;
    }

    .brand-en {
      font-size: 0.76rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 4px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.92rem;
      margin-top: 4px;
    }

    .mode-switch-wrap {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .mode-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--ink);
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mode-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .closed-banner {
      display: none;
      max-width: 680px;
      margin: 14px auto 0;
      background: #fdf2ec;
      color: var(--warm);
      border: 1px solid #f0d2c2;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .closed-banner.visible {
      display: block;
    }

    /* Mobile Category Strip */
    .mobile-strip {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(250, 248, 245, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 8px 14px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .mobile-strip::-webkit-scrollbar {
      display: none;
    }

    .mobile-link {
      flex: 0 0 auto;
      text-decoration: none;
      font-size: 0.82rem;
      color: var(--muted);
      padding: 5px 11px;
      border-radius: 8px;
      font-weight: 500;
    }

    .mobile-link.active {
      color: var(--ink);
      background: var(--surface-alt);
      font-weight: 600;
    }

    /* Main Layout */
    .layout {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
    }

    @media (min-width: 820px) {
      .layout {
        grid-template-columns: 176px 1fr;
        align-items: start;
        gap: 36px;
      }

      .mobile-strip {
        display: none;
      }
    }

    /* Subtle Side Navigation */
    .side-nav {
      display: none;
    }

    @media (min-width: 820px) {
      .side-nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
        position: sticky;
        top: 28px;
        padding-top: 4px;
        border-left: 1px solid var(--border);
        padding-left: 12px;
      }

      .side-link {
        text-decoration: none;
        color: var(--muted);
        font-size: 0.88rem;
        font-weight: 400;
        padding: 6px 8px;
        border-radius: 7px;
        transition: color 0.15s ease, background 0.15s ease;
      }

      .side-link:hover {
        color: var(--ink);
        background: var(--surface-alt);
      }

      .side-link.active {
        color: var(--ink);
        font-weight: 600;
        background: var(--surface-alt);
      }
    }

    /* Menu Sections */
    .section-block {
      scroll-margin-top: 56px;
      margin-bottom: 38px;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 10px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }

    .section-title {
      font-size: 1.28rem;
      font-weight: 700;
      color: var(--ink);
    }

    .section-sub {
      font-size: 0.82rem;
      color: var(--muted);
    }

    /* Clean List */
    .menu-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-top: 10px;
      overflow: hidden;
    }

    .menu-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 15px 18px;
      border-bottom: 1px solid var(--border);
    }

    .menu-row:last-child {
      border-bottom: none;
    }

    .row-content {
      flex: 1;
      min-width: 0;
    }

    .row-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .item-title {
      font-size: 1.03rem;
      font-weight: 600;
      color: var(--ink);
    }

    .item-price {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--warm);
      white-space: nowrap;
    }

    .item-desc {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .sizes {
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 9px;
    }

    body.ordering-mode .sizes {
      display: flex;
    }

    .size-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      font-family: inherit;
      font-size: 0.78rem;
      padding: 3px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .size-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    .add-btn {
      display: none;
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    body.ordering-mode .add-btn {
      display: inline-block;
    }

    .add-btn:hover:not(:disabled) {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .status-msg {
      text-align: center;
      color: var(--muted);
      padding: 32px 12px;
      font-size: 0.95rem;
    }

    /* Floating Order Bar */
    .order-bar {
      display: none;
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 680px;
      background: var(--ink);
      color: #fff;
      border-radius: 16px;
      padding: 11px 16px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 12px 28px rgba(20, 17, 15, 0.22);
      z-index: 30;
      cursor: pointer;
    }

    body.ordering-mode .order-bar {
      display: flex;
    }

    .order-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.94rem;
      font-weight: 500;
    }

    .order-count {
      background: var(--warm);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .order-cta {
      background: #fff;
      color: var(--ink);
      border: none;
      border-radius: 10px;
      padding: 7px 13px;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Cart Sheet */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 17, 15, 0.42);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }

    .backdrop.open {
      display: flex;
    }

    .sheet {
      background: var(--surface);
      width: 100%;
      max-width: 560px;
      max-height: 88vh;
      border-radius: 22px 22px 0 0;
      padding: 22px 20px;
      overflow-y: auto;
    }

    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .close-btn {
      border: none;
      background: var(--surface-alt);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .qty-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-btn {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-weight: 700;
      cursor: pointer;
    }

    .inputs {
      display: grid;
      gap: 9px;
      margin-top: 14px;
    }

    .input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 11px;
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 0.9rem;
      background: #fff;
    }

    .input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .confirm-btn {
      margin-top: 14px;
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
    }

    .confirm-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .feedback {
      margin-top: 12px;
      padding: 12px;
      border-radius: 11px;
      font-size: 0.9rem;
      display: none;
    }

    .feedback.err {
      display: block;
      background: #fdf2ec;
      color: var(--warm);
      font-weight: 600;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 22px 8px;
    }

    /* Order Confirmation Screen */
    .done-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .done-screen.open {
      display: flex;
    }

    .done-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .done-label {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .done-number {
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--accent);
      margin: 6px 0 12px;
    }

    .done-sub {
      font-size: 0.94rem;
      color: var(--muted);
      margin-bottom: 22px;
    }

    .done-btn {
      width: 100%;
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-en">benenu</div>
    <h1 id="businessTitle">בינינו</h1>
    <p class="subtitle">קפה, מאפים וכריכים · איסוף מהדלפק</p>
    <div class="mode-switch-wrap" id="modeSwitchWrap">
      <button type="button" class="mode-btn active" id="viewModeBtn" onclick="setOrderingMode(false)">עיון בתפריט</button>
      <button type="button" class="mode-btn" id="orderModeBtn" onclick="setOrderingMode(true)">הזמנה</button>
    </div>
    <div class="closed-banner" id="closedBanner">קבלת הזמנות באתר סגורה כרגע — ניתן לצפות בתפריט</div>
  </header>

  <nav class="mobile-strip" id="mobileNav" aria-label="קטגוריות"></nav>

  <div class="layout">
    <aside class="side-nav" id="sideNav" aria-label="קטגוריות תפריט"></aside>
    <main id="menuRoot"><p class="status-msg">טוען תפריט...</p></main>
  </div>

  <div class="order-bar" onclick="openSheet()">
    <div class="order-left">
      <span class="order-count" id="barCount">0</span>
      <span>ההזמנה שלי</span>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <strong id="barTotal">0 ₪</strong>
      <button type="button" class="order-cta">לסיכום</button>
    </div>
  </div>

  <div class="backdrop" id="sheetBackdrop" onclick="if (event.target.id === 'sheetBackdrop') closeSheet()">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-head">
        <h2>ההזמנה שלי</h2>
        <button type="button" class="close-btn" onclick="closeSheet()" aria-label="סגור">✕</button>
      </div>
      <div id="sheetItems"></div>
      <div class="inputs">
        <input type="text" class="input" id="nameInput" placeholder="שם *" required />
        <input type="tel" class="input" id="phoneInput" placeholder="טלפון לעדכון כשהזמנה מוכנה *" required />
        <input type="text" class="input" id="noteInput" placeholder="הערות (למשל נטול קפאין, בלי קרח)" />
      </div>
      <button type="button" class="confirm-btn" id="submitBtn" onclick="submitOrder()">
        שליחת הזמנה · <span id="sheetTotal">0 ₪</span>
      </button>
      <div class="feedback" id="orderFeedback"></div>
    </div>
  </div>

  <div class="done-screen" id="doneScreen">
    <div class="done-card">
      <div class="done-label">ההזמנה התקבלה</div>
      <div class="done-number" id="doneOrderNumber">#—</div>
      <p class="done-sub">נעדכן אותך בוואטסאפ כשהיא מוכנה על הדלפק.</p>
      <button type="button" class="done-btn" onclick="backToMenu()">חזרה לתפריט</button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbziLXiN0ZaU-yQTln6anOu2vjsRNEAUKq2Jh6mYk1WwymKne9TikZp2gdW3bOGxT0Lb/exec";

    let sections = [];
    let ordersOpen = true;
    let orderingMode = false;
    let activeId = "";
    const sizeIdx = {};
    const cart = [];

    function setOrderingMode(enable) {
      if (enable && !ordersOpen) return;
      orderingMode = enable;
      document.body.classList.toggle("ordering-mode", orderingMode);
      document.getElementById("viewModeBtn").classList.toggle("active", !orderingMode);
      document.getElementById("orderModeBtn").classList.toggle("active", orderingMode);
      if (!orderingMode) closeSheet();
    }

    function slugifyCategory(cat) {
      return "cat-" + encodeURIComponent(String(cat || "").trim().toLowerCase().replace(/\s+/g, "-"));
    }

    function groupItemsToSections(items) {
      const map = new Map();
      items.forEach(item => {
        const cat = item.category || "כללי";
        if (!map.has(cat)) {
          map.set(cat, {
            id: slugifyCategory(cat),
            category: cat,
            sub: item.category_note || "",
            items: []
          });
        }
        const sizes = Array.isArray(item.sizes) && item.sizes.length
          ? item.sizes
          : [{ label: "רגיל", price: 0 }];
        map.get(cat).items.push({
          id: item.item_id || item.name,
          name: item.name,
          desc: item.desc || "",
          sizes
        });
      });
      return Array.from(map.values());
    }

    function updateSubmitButtonLabel() {
      const btn = document.getElementById("submitBtn");
      const { total } = totals();
      btn.disabled = !ordersOpen;
      btn.innerHTML = `שליחת הזמנה · <span id="sheetTotal">${total} ₪</span>`;
    }

    async function loadMenuFromSheet() {
      try {
        const res = await fetch(`${API_URL}?action=public&_t=${Date.now()}`, { cache: "no-store" });
        const data = await res.json();
        if (!data || !data.ok) {
          throw new Error((data && data.error) || "שגיאה בטעינת התפריט");
        }

        if (data.businessName) {
          document.getElementById("businessTitle").textContent = data.businessName;
        }
        ordersOpen = data.ordersOpen !== false;
        document.getElementById("closedBanner").classList.toggle("visible", !ordersOpen);
        document.getElementById("orderModeBtn").disabled = !ordersOpen;
        if (!ordersOpen) setOrderingMode(false);
        updateSubmitButtonLabel();

        sections = groupItemsToSections(data.items || []);
        sections.forEach(s => s.items.forEach(i => {
          if (sizeIdx[i.id] === undefined) sizeIdx[i.id] = 0;
        }));

        if (sections.length) {
          activeId = sections[0].id;
        }
        renderNavs();
        renderList();
        observeSections();
      } catch (err) {
        document.getElementById("menuRoot").innerHTML =
          `<p class="status-msg">לא הצלחנו לטעון את התפריט כרגע. נסה לרענן את העמוד.</p>`;
      }
    }

    function renderNavs() {
      document.getElementById("sideNav").innerHTML = sections.map(s => `
        <a href="#${s.id}" class="side-link ${s.id === activeId ? "active" : ""}" data-nav="${s.id}">${s.category}</a>
      `).join("");

      document.getElementById("mobileNav").innerHTML = sections.map(s => `
        <a href="#${s.id}" class="mobile-link ${s.id === activeId ? "active" : ""}" data-nav="${s.id}">${s.category}</a>
      `).join("");
    }

    function setActiveNav(id) {
      activeId = id;
      document.querySelectorAll("[data-nav]").forEach(el => {
        el.classList.toggle("active", el.getAttribute("data-nav") === id);
      });
    }

    function observeSections() {
      const obs = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) setActiveNav(entry.target.id);
        });
      }, { rootMargin: "-20% 0px -65% 0px" });

      document.querySelectorAll(".section-block").forEach(el => obs.observe(el));
    }

    function renderList() {
      if (!sections.length) {
        document.getElementById("menuRoot").innerHTML = `<p class="status-msg">אין כרגע פריטים פעילים בתפריט.</p>`;
        return;
      }

      document.getElementById("menuRoot").innerHTML = sections.map(sec => `
        <section class="section-block" id="${sec.id}">
          <div class="section-head">
            <h2 class="section-title">${sec.category}</h2>
            <span class="section-sub">${sec.sub || ""}</span>
          </div>
          <div class="menu-list">
            ${sec.items.map(item => {
              const idx = sizeIdx[item.id] || 0;
              const current = item.sizes[idx] || item.sizes[0];
              return `
                <article class="menu-row">
                  <div class="row-content">
                    <div class="row-top">
                      <h3 class="item-title">${item.name}</h3>
                      <span class="item-price">${current.price} ₪</span>
                    </div>
                    <p class="item-desc">${item.desc}</p>
                    ${item.sizes.length > 1 ? `
                      <div class="sizes">
                        ${item.sizes.map((sz, i) => `
                          <button type="button" class="size-btn ${i === idx ? "active" : ""}" onclick="pickSize('${item.id.replace(/'/g, "\\'")}', ${i})">
                            ${sz.label} (${sz.price} ₪)
                          </button>
                        `).join("")}
                      </div>
                    ` : ""}
                  </div>
                  <button type="button" class="add-btn" onclick="addItem('${item.id.replace(/'/g, "\\'")}')">+ הוסף</button>
                </article>
              `;
            }).join("")}
          </div>
        </section>
      `).join("");
    }

    function pickSize(itemId, idx) {
      sizeIdx[itemId] = idx;
      renderList();
    }

    function getItem(itemId) {
      for (const s of sections) {
        const found = s.items.find(i => i.id === itemId);
        if (found) return found;
      }
      return null;
    }

    function addItem(itemId) {
      const item = getItem(itemId);
      if (!item) return;
      const sz = item.sizes[sizeIdx[itemId] || 0] || item.sizes[0];
      const key = `${item.id}__${sz.label}`;
      const existing = cart.find(c => c.key === key);
      if (existing) existing.qty += 1;
      else cart.push({ key, name: item.name, size: sz.label, price: Number(sz.price) || 0, qty: 1 });
      renderBar();
    }

    function changeQty(idx, delta) {
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      renderBar();
      renderSheet();
    }

    function totals() {
      return {
        count: cart.reduce((s, i) => s + i.qty, 0),
        total: cart.reduce((s, i) => s + i.price * i.qty, 0)
      };
    }

    function renderBar() {
      const { count, total } = totals();
      document.getElementById("barCount").textContent = count;
      document.getElementById("barTotal").textContent = `${total} ₪`;
      const sheetTotalEl = document.getElementById("sheetTotal");
      if (sheetTotalEl) sheetTotalEl.textContent = `${total} ₪`;
    }

    function openSheet() {
      document.getElementById("orderFeedback").className = "feedback";
      document.getElementById("orderFeedback").textContent = "";
      renderSheet();
      renderBar();
      document.getElementById("sheetBackdrop").classList.add("open");
    }

    function closeSheet() {
      document.getElementById("sheetBackdrop").classList.remove("open");
    }

    function openDoneScreen(orderId) {
      document.getElementById("doneOrderNumber").textContent = `#${orderId}`;
      document.getElementById("doneScreen").classList.add("open");
    }

    function backToMenu() {
      document.getElementById("doneScreen").classList.remove("open");
      setOrderingMode(false);
    }

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeSheet();
    });

    function renderSheet() {
      const box = document.getElementById("sheetItems");
      if (!cart.length) {
        box.innerHTML = `<p class="empty">ההזמנה ריקה כרגע.</p>`;
        return;
      }
      box.innerHTML = cart.map((item, idx) => `
        <div class="cart-row">
          <div>
            <strong>${item.name}</strong>
            <div style="font-size:0.82rem; color:var(--muted);">${item.size} · ${item.price} ₪</div>
          </div>
          <div class="qty-box">
            <button type="button" class="qty-btn" onclick="changeQty(${idx}, -1)">-</button>
            <span>${item.qty}</span>
            <button type="button" class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
          </div>
        </div>
      `).join("");
    }

    async function submitOrder() {
      const fb = document.getElementById("orderFeedback");
      fb.className = "feedback";

      if (!ordersOpen) {
        fb.className = "feedback err";
        fb.textContent = "קבלת הזמנות סגורה כרגע.";
        return;
      }
      if (!cart.length) {
        fb.className = "feedback err";
        fb.textContent = "בחר לפחות פריט אחד לפני שליחה.";
        return;
      }

      const name = document.getElementById("nameInput").value.trim();
      const phone = document.getElementById("phoneInput").value.trim();
      const note = document.getElementById("noteInput").value.trim();

      if (!name || !phone) {
        fb.className = "feedback err";
        fb.textContent = "יש למלא שם ומספר טלפון.";
        return;
      }

      const { total } = totals();
      const itemsSummary = cart
        .map(i => `${i.qty}x ${i.name}${i.size && i.size !== "רגיל" ? ` (${i.size})` : ""}`)
        .join(", ");

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "שולח הזמנה...";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "createOrder",
            name,
            phone,
            tableOrPickup: "דלפק",
            itemsSummary,
            note,
            total
          })
        });
        const data = await res.json();
        if (!data || !data.ok) {
          throw new Error((data && data.error) || "שגיאה בשליחת ההזמנה");
        }

        const orderNum = data.orderId;
        cart.length = 0;
        document.getElementById("noteInput").value = "";
        renderBar();
        renderSheet();
        closeSheet();
        openDoneScreen(orderNum);
      } catch (err) {
        fb.className = "feedback err";
        fb.textContent = `לא הצלחנו לשלוח את ההזמנה: ${err.message}`;
      } finally {
        updateSubmitButtonLabel();
      }
    }

    renderBar();
    loadMenuFromSheet();
  </script>
</body>
</html>
